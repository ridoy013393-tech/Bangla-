name: Build Bangla Chat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore app/google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          elif [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::error::app/google-services.json is missing! Add a GitHub Repository Secret named GOOGLE_SERVICES_JSON with the contents of app/google-services.json."
            exit 1
          fi

      - name: Restore project debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare BanglaChat.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk BanglaChat.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaChat-APK
          path: BanglaChat.apk

      - name: Publish Direct Download Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Bangla Chat (Latest APK)
          body: "Bangla Chat ইনস্টলযোগ্য Android APK — নিচের BanglaChat.apk ফাইলে ট্যাপ করে সরাসরি ফোনে ডাউনলোড ও ইনস্টল করুন।"
          files: BanglaChat.apk
          make_latest: true
