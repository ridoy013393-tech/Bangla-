name: Build Bangla Chat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore app/google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          elif [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json."
          else
            echo "::error::app/google-services.json is missing! Add a GitHub Repository Secret named GOOGLE_SERVICES_JSON with the contents of app/google-services.json."
            exit 1
          fi

      - name: Restore project debug keystore and verify SHA-1
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64."
          else
            echo "::error::Missing debug.keystore.base64! Add DEBUG_KEYSTORE_BASE64 GitHub Secret so Google Sign-In SHA-1 matches Firebase."
            exit 1
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256" || true

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare BanglaChat.apk & version.json
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BanglaChat.apk
          V_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')
          V_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          PUB_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "V_CODE=${V_CODE:-1}" >> "$GITHUB_ENV"
          echo "V_NAME=${V_NAME:-1.0}" >> "$GITHUB_ENV"
          cat <<EOF > version.json
          {
            "versionCode": ${V_CODE:-1},
            "versionName": "${V_NAME:-1.0}",
            "forceUpdate": true,
            "publishedAt": "${PUB_AT}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-apk/BanglaChat.apk",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/latest-apk",
            "notes": "Bangla Chat v${V_NAME:-1.0} — নতুন ফিচার, নিরাপত্তা ও পারফরম্যান্স আপডেট"
          }
          EOF
          cat version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaChat-APK
          path: BanglaChat.apk

      - name: Publish Direct Download Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Bangla Chat v${{ env.V_NAME }} (Latest APK)
          body: "Bangla Chat v${{ env.V_NAME }} (Build ${{ env.V_CODE }}) — নিচের BanglaChat.apk ফাইলে ট্যাপ করে সরাসরি ফোনে ডাউনলোড ও ইনস্টল করুন।"
          files: |
            BanglaChat.apk
            version.json
          make_latest: true
